---
services:
  db:
    image: sreejaredithala/devops:mydata
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    image: sreejaredithala/devops:authorization
    ports:
      - "5001:5001"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  book_service:
    image: sreejaredithala/devops:books
    ports:
      - "5002:5002"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  borrow_service:
    image: sreejaredithala/devops:borrowapp
    ports:
      - "5003:5003"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  frontend:
    image: sreejaredithala/devops:pythonapp
    ports:
      - "5000:5000"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

networks:
  myapp:
    driver: overlay

volumes:
  mydata:
